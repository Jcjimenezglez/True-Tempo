    <!-- Content Section — keyword article (not homepage clone) -->
    <section class="content-section">
        <div class="content-container">
            <h1 class="content-hero-title">{{H1}}</h1>
            <p class="content-hero-subtitle">{{HERO_SUBTITLE}}</p>

            <div class="content-hero-cta-wrap">
                <a href="/?ref=pseo-{{SLUG}}" class="content-hero-cta">Start free in Superfocus →</a>
            </div>

            <article class="pseo-article">
                {{ARTICLE_BODY}}
            </article>

            <div class="content-hero-cta-wrap" style="margin-top: 2.5rem;">
                <a href="/?ref=pseo-{{SLUG}}-mid" class="content-hero-cta">Try the timer free →</a>
            </div>

            <h2>FAQ</h2>
            <div class="faq-list content-faq-accordion">
                {{FAQ}}
            </div>

            <div class="content-related-section" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <h3 style="font-size: 1rem; margin-bottom: 1rem; color: rgba(255,255,255,0.7); font-weight: 500;">Related</h3>
                <ul style="list-style: none; padding: 0; margin: 0;">{{RELATED_LINKS}}</ul>
            </div>

            {{EXTERNAL_LINKS}}
        </div>
    </section>
